title: "[Casos] "
body:
  - type: markdown
    attributes:
      value: |
        ## Casos
        Hilo estable conectado a cada ficha del atlas mediante su identificador `case:<id>`.

        Separa observación, evidencia, hipótesis e incertidumbre. Añade enlaces directos y explica qué falta por comprobar.

        **Misión activa:** Revisa GoFast: separa lo medido, lo calculado y lo que aún falta.
  - type: input
    id: when-where
    attributes:
      label: "Fecha y ubicación aproximada / Date and approximate location"
      description: "Incluye zona horaria cuando sea relevante. No publiques domicilios ni coordenadas privadas."
      placeholder: "AAAA-MM-DD · región o localidad aproximada"
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: "Qué se observó / What was observed"
      description: "Describe duración, dirección, movimiento, condiciones y dispositivo antes de interpretar."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidencia y fuentes / Evidence and sources"
      description: "Enlaza originales, documentos fechados, archivos completos o permalinks del atlas."
    validations:
      required: true
  - type: textarea
    id: hypotheses
    attributes:
      label: "Hipótesis comprobadas / Hypotheses checked"
      description: "Explica qué alternativas se probaron, con qué método y qué resultado obtuviste."
    validations:
      required: false
  - type: textarea
    id: open-question
    attributes:
      label: "Pregunta concreta / Specific question"
      description: "¿Qué dato, cálculo o fuente ayudaría a avanzar?"
    validations:
      required: true
  - type: checkboxes
    id: community-check
    attributes:
      label: "Comprobación antes de publicar / Pre-publish check"
      options:
        - label: "He retirado datos personales y distingo hechos, hipótesis e incertidumbre. / I removed personal data and distinguish facts, hypotheses, and uncertainty."
          required: true
