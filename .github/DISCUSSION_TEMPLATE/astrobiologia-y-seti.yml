title: "[Astrobiología y SETI] "
body:
  - type: markdown
    attributes:
      value: |
        ## Astrobiología y SETI
        Vida, biosignaturas y tecnofirmas tratadas como ciencia relacionada, no como explicación automática de un avistamiento.

        Separa observación, evidencia, hipótesis e incertidumbre. Añade enlaces directos y explica qué falta por comprobar.
  - type: input
    id: region
    attributes:
      label: "País, región e idioma / Country, region, and language"
      description: "Ayuda a localizar instituciones, archivos y contexto local."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Contexto local / Local context"
      description: "Incluye definiciones, periodo, organismo, particularidades geográficas o culturales."
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: "Fuentes regionales / Regional sources"
      description: "Prioriza archivos, prensa, publicaciones y testigos de la región."
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: "Comparación y límites / Comparison and limitations"
      description: "Explica qué puede compararse con otros países y qué sesgos lo impiden."
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: "Pregunta concreta / Specific question"
      description: "¿Qué colaboración o conocimiento local necesitas?"
    validations:
      required: true
  - type: checkboxes
    id: community-check
    attributes:
      label: "Comprobación antes de publicar / Pre-publish check"
      options:
        - label: "He conservado el idioma y contexto originales o declarado la traducción. / I preserved the original language and context or declared the translation."
          required: true
